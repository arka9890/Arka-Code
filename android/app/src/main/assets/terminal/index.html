<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Terminal</title>
<link rel="stylesheet" href="xterm.css">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111111;
  }
  /* Tanpa padding: fit() memakai clientWidth/clientHeight, yang sudah kotak konten. */
  #term {
    position: absolute;
    inset: 0;
  }
  .xterm .xterm-viewport {
    background: #111111 !important;
  }
</style>
</head>
<body>
<div id="term"></div>
<script src="xterm.js"></script>
<script>
  const term = new Terminal({
    fontSize: 13,
    fontFamily: "monospace",
    scrollback: 5000,
    convertEol: false,
    cursorBlink: true,
    theme: { background: "#111111" }
  });

  const host = document.getElementById("term");
  term.open(host);

  // Kotlin -> JS. Bytes, bukan string, supaya urutan UTF-8 tidak terpotong.
  window.termWrite = b64 => {
    const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    term.write(bytes, () => Bridge.ack(bytes.length));
  };

  window.termGetSelection = () => term.getSelection();

  // Ukuran sel dari renderer xterm; API privat, jadi ada fallback 8x16 px.
  function cellSize() {
    const dims = term._core && term._core._renderService && term._core._renderService.dimensions;
    const css = dims && (dims.css || dims);
    const cell = css && css.cell;
    if (cell && cell.width > 0 && cell.height > 0) return cell;
    return { width: 8, height: 16 };
  }

  function fit() {
    // `loadUrl` berjalan sebelum AndroidView terpasang, jadi host.clientWidth /
    // clientHeight bisa 0 dan clamp di bawah menghasilkan winsize palsu 2x2
    // (prompt shell jadi berlipat sampai ResizeObserver menembak pertama).
    if (host.clientWidth <= 0 || host.clientHeight <= 0) return;
    const cell = cellSize();
    const cols = Math.max(2, Math.floor(host.clientWidth / cell.width));
    const rows = Math.max(2, Math.floor(host.clientHeight / cell.height));
    if (cols !== term.cols || rows !== term.rows) term.resize(cols, rows);
  }

  term.onData(d => Bridge.input(toBase64(d)));
  term.onResize(({ rows, cols }) => Bridge.resize(rows, cols));

  // String JS -> byte UTF-8 -> base64, dipotong agar argumen btoa tidak meluap.
  function toBase64(s) {
    const bytes = new TextEncoder().encode(s);
    let bin = "";
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  fit();
  term.focus();
  new ResizeObserver(fit).observe(host);
  window.addEventListener("resize", fit);
</script>
</body>
</html>
