name: Android Release (signed APK)

# Rilis APK: ditandatangani lewat keystore yang TER-COMMIT (android/arkacode
# .keystore + keystore.properties) — tanpa secret repo sama sekali.
# Dijalankan otomatis saat tag v* (mis. push tag v0.2.1); manual dispatch
# juga bisa, isi input "tag_name" bila ingin langsung terbit Release.

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag rilis (contoh: v0.2.1) — kosong = hanya artifact'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew :app:assembleRelease --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: arkacode-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag_name }}
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
