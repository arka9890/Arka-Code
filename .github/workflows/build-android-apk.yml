name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # Modul native pty (src/main/cpp) butuh NDK + CMake persis versi yang
      # dikunci di build.gradle.kts. Runner default sudah punya, tapi dipasang
      # eksplisit supaya build tetap stabil walau image runner berganti.
      - name: Install NDK & CMake
        run: |
          CMD="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$CMD" ]; then
            yes | "$CMD" --install "ndk;27.0.12077973" "cmake;3.22.1" >/dev/null 2>&1 || true
          fi
          ls "$ANDROID_HOME/ndk/" 2>/dev/null || echo "tidak ada NDK"
          ls "$ANDROID_HOME/cmake/" 2>/dev/null || echo "tidak ada CMake"

      # Installer TTS engine (~148 MB) diunduh saat build. Disimpan di cache
      # supaya tidak diunduh ulang tiap run; kunci berubah kalau versi engine
      # di buildSrc berubah.
      - name: Cache installer TTS engine
        uses: actions/cache@v4
        with:
          path: android/app/build/tts-engine-cache
          key: tts-engine-${{ hashFiles('android/buildSrc/src/main/kotlin/arka/TtsEngineApk.kt') }}
          restore-keys: tts-engine-

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --stacktrace

      # Unit test JVM (tanpa perangkat). Selama ini tak pernah dijalankan CI —
      # ditambahkan saat Arka Buddy masuk supaya cek regresi murni (PathNames,
      # ModelSupport, EngineRelease, BuddyFace) benar-benar dieksekusi.
      - name: Unit test
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # Task downloadProotBinaries mengambil binary proot dari paket Termux ke
      # jniLibs. Kalau mirror tidak terjangkau, build tetap sukses tanpa dukungan
      # distro (run_command tidak akan jalan) — detailnya ada di log.
      - name: Ringkas isi jniLibs (proot)
        if: always()
        run: ls -la android/app/build/generated/prootJniLibs/*/ 2>/dev/null || echo "jniLibs proot kosong (di-skip/offline)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arkacode-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
